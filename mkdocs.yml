# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

# Project information
site_name: KEEBOX LIST™
site_url: https://andriksantos.com/keebox/
site_author: Andrik Santos
site_description: >-
  KEEBOX LIST™ is a free, curated directory of 6,500+ hand-picked developer
  resources: tools, libraries, frameworks and guides for AI, Python, web,
  Node.js, npm, iOS, Swift, macOS, Electron and DevOps.

# Repository
repo_name: andriksantos/keebox
repo_url: https://github.com/andriksantos/keebox
edit_uri: edit/master/docs/

# Copyright
copyright: Copyright &copy; 2018 - 2026 Andrik Santos™

# Navigation
nav:
  - Home: index.md
  - Resources:
      - AI & LLM Tools: ai.md
      - Python: python.md
      - Web Development: web.md
      - Node.js: nodejs.md
      - npm: npm.md
      - DevOps & Self-hosting: devops.md
      - iOS: ios.md
      - Swift: swift.md
      - macOS: mac.md
      - Electron: electron.md
      - Learning & Free Resources: learn.md
      - Awesome Lists Directory: lists.md
  - Community:
      - Contributing: contributing.md
      - Code of conduct: code-of-conduct.md
      - Donate: donate.md

# Configuration
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/img/logo-isotipo-white.png
  favicon: assets/img/favicon.png
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    # Follow the operating system
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.tooltips
    - announce.dismiss
    - navigation.indexes

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.keys
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Extra (a single block: duplicated "extra:" keys overwrite each other)
extra:
  # Google Analytics 4 (with "Was this page helpful?" feedback widget)
  analytics:
    provider: google
    property: G-NS99JL93ZV
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks! Help us improve it by
            <a href="https://github.com/andriksantos/keebox/issues/new" target="_blank" rel="noopener">opening an issue</a>.
  # Google Tag Manager container ID. Empty = disabled.
  gtm_id: GTM-5B3HBLJW
  # Microsoft Clarity project ID (clarity.microsoft.com → Settings → Overview). Empty = disabled.
  clarity_id: zfvhgxj5mr
  # Bing Webmaster Tools verification code (optional). Empty = disabled.
  bing_verification: ""
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/andriksantos
      name: Andrik Santos on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/andriksantos/
      name: Follow me on LinkedIn
    - icon: fontawesome/solid/globe
      link: https://andriksantos.com
      name: andriksantos.com
