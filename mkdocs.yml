# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

# Project information
site_name: KEEBOX LIST™
site_url: https://andriksantos.com/keebox/
site_author: Andrik Santos
site_description: >-
  KEEBOX LIST™ is a free directory of 80,000+ developer resources: 7,000+
  hand-picked tools and guides for AI, Python, Go, Rust, Java, .NET, PHP,
  web, mobile, cloud, data, DevOps, security and design, plus a Library of
  444 public-domain awesome lists.

# Repository
repo_name: andriksantos/keebox
repo_url: https://github.com/andriksantos/keebox
edit_uri: edit/master/docs/

# Copyright
copyright: Copyright &copy; 2018 - 2026 Andrik Santos™

# Library pages are reached from library/index.md, not listed one by one in the menu
not_in_nav: |
  /library/*.md

# Navigation
nav:
  - Home: index.md
  - Resources:
      - AI & Data:
          - AI & LLM Tools: ai.md
          - Data Engineering & Analytics: data.md
          - Databases: databases.md
      - Languages:
          - Python: python.md
          - Go: go.md
          - Rust: rust.md
          - Java & Kotlin: java.md
          - C# & .NET: dotnet.md
          - PHP: php.md
          - Node.js: nodejs.md
          - npm: npm.md
          - Swift: swift.md
      - Web & Mobile:
          - Web Development: web.md
          - APIs: apis.md
          - Mobile Development: mobile.md
          - iOS: ios.md
          - Electron: electron.md
          - Templates & Starters: templates.md
      - Infrastructure:
          - DevOps & Self-hosting: devops.md
          - Cloud & Free Tiers: cloud.md
          - Linux & Terminal: linux.md
          - Security: security.md
          - Testing & QA: testing.md
      - Creative & Hardware:
          - Design & UI Assets: design.md
          - Game Development: gamedev.md
          - IoT & Hardware: iot.md
          - Blockchain & Web3: web3.md
      - Tools & Learning:
          - Learning & Free Resources: learn.md
          - Recursos en español: espanol.md
          - Cheat Sheets: cheatsheets.md
          - Free Online Tools: online-tools.md
          - Editor & Browser Extensions: extensions.md
          - Podcasts, Newsletters & Videos: media.md
          - macOS: mac.md
          - Awesome Lists Directory: lists.md
  - Library: library/index.md
  - Community:
      - Contributing: contributing.md
      - Code of conduct: code-of-conduct.md
      - Donate: donate.md
      - Sponsor KEEBOX: sponsors.md
      - Supporters: supporters.md
      - Transparency: transparency.md
      - Credits & Licenses: credits.md

# Configuration
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/img/logo-isotipo-white.png
  favicon: assets/img/favicon.png
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    # Follow the operating system
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.tooltips
    - announce.dismiss
    - navigation.indexes

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.keys
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Extra (a single block: duplicated "extra:" keys overwrite each other)
extra:
  # Google Analytics 4 (with "Was this page helpful?" feedback widget)
  analytics:
    provider: google
    property: G-NS99JL93ZV
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks! If KEEBOX saved you time, a small contribution keeps it running:
            <a href="https://buymeacoffee.com/andriksantos" target="_blank" rel="noopener">buy me a coffee ☕</a>
            or <a href="https://www.paypal.com/paypalme/AndrikSantosHN/5" target="_blank" rel="noopener">donate $5 with PayPal</a>.
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks! Help us improve it by
            <a href="https://github.com/andriksantos/keebox/issues/new" target="_blank" rel="noopener">opening an issue</a>.
  # Donations — edit amounts, links and the monthly goal here
  donate:
    paypal: https://www.paypal.com/paypalme/AndrikSantosHN
    amounts: [3, 5, 10, 50]
    buymeacoffee: https://buymeacoffee.com/andriksantos
    email: andricksantos1@gmail.com
    goal:
      label: Monthly goal
      target: 100     # USD per month
      raised: 0       # update when donations arrive
  # Google Tag Manager container ID. Empty = disabled.
  gtm_id: GTM-5B3HBLJW
  # Microsoft Clarity project ID (clarity.microsoft.com → Settings → Overview). Empty = disabled.
  clarity_id: zfvhgxj5mr
  # Bing Webmaster Tools verification code (optional). Empty = disabled.
  bing_verification: ""
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/andriksantos
      name: Andrik Santos on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/andriksantos/
      name: Follow me on LinkedIn
    - icon: fontawesome/solid/globe
      link: https://andriksantos.com
      name: andriksantos.com
